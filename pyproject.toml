[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-prod-ready"
version = "0.1.0"
description = "Interactive Production-Readiness Checklist & Hardening Workbench for Google Cloud AI Agents (Cloud Run & Agent Runtime), 100% compatible with google-agents-cli."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
prod-ready = "prod_ready.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skills/agent-production-readiness/scripts/prod_ready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/agent-production-readiness/scripts"]
